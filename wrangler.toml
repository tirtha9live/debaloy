name = "debaloy"
main = "./src/worker.ts"
account_id = "b6bd3fa3e8ee9d0873fd3b19564b2215"
compatibility_date = "2026-06-02"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

# NEW Debaloy-only resources. Do not reuse or modify the live "bytebox"
# Worker, its KV (bytebox-session / 5eb979cbb1ce4ce39ff556d37e3e7b58),
# or its D1 (bytebox-feedback / cdf20eac-64b4-41da-b945-b04b4bb409b5).

[[kv_namespaces]]
binding = "SESSION"
id = "3abc22bcdabf4082b70d15ab77fe477f"

[[d1_databases]]
binding = "DB"
database_name = "debaloy-ledger"
database_id = "0506c321-9cac-4f3b-90a9-63e1ee490ec4"
migrations_dir = "migrations"

# Expense receipts (images/PDFs). App keeps total under 5 GB (R2 free tier is 10 GB-month).
[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "debaloy-receipts"

# Per-session limits for receipt uploads and views.
[[ratelimits]]
name = "RECEIPT_UPLOAD_LIMIT"
namespace_id = "7101"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RECEIPT_VIEW_LIMIT"
namespace_id = "7102"
simple = { limit = 120, period = 60 }

# 1 Jan 10:30 IST: fetch bank holidays (HDFC) + festival dates (Drik Panchang) and consolidate the festival calendar.
# 1 Jan 18:00 IST: refetch whichever is still missing and consolidate again.
[triggers]
crons = ["0 5 1 1 *", "30 12 1 1 *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
# Set to "true" during deploys or debugging — maintenance notice on landing + top banner.
DEBUG = "false"

[observability]
enabled = true
